<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">Urvalsprocess för mottagningar</title><desc id="svg-desc">Visualisering av register, grundkrav, relevans, dialogpalett och gemensamt sluturval.</desc><rect width="1600" height="760" fill="#FFF8F7"/><rect x="0" y="0" width="1600" height="14" fill="#DB002E" opacity="1"/><text x="70" y="74" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="800" fill="#DB002E" text-anchor="start" letter-spacing="1.5" opacity="1">VIS-RFSU-002</text><text x="70" y="114" font-family="Arial Narrow, Helvetica Neue Condensed, Arial, sans-serif" font-size="32" font-weight="800" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">Urval som stegvis precisering</text><text x="70" y="142" font-family="Arial, Helvetica Neue, sans-serif" font-size="14" font-weight="400" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">Inte ranking: varje steg minskar osäkerhet och ökar analytisk relevans.</text><rect x="70" y="300" width="220" height="220" fill="#FFFFFF" opacity="1" rx="28" stroke="#EAD8DF" stroke-width="1"/><text x="94" y="346" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="800" fill="#DB002E" text-anchor="start" letter-spacing="0.9" opacity="1">BRETT REGISTER</text><text x="94" y="418" font-family="Arial Narrow, Helvetica Neue Condensed, Arial, sans-serif" font-size="38" font-weight="850" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">27</text><text x="94" y="458" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="600" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">identifierade</text><line x1="295" y1="410" x2="305" y2="410" stroke="#F8C2BE" stroke-width="4" opacity="1"/><path d="M 305 402 L 319 410 L 305 418 Z" fill="#F8C2BE"/><rect x="324" y="300" width="220" height="220" fill="#FFFFFF" opacity="1" rx="28" stroke="#EAD8DF" stroke-width="1"/><text x="348" y="346" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="800" fill="#DB002E" text-anchor="start" letter-spacing="0.9" opacity="1">GRUNDKRAV</text><text x="348" y="418" font-family="Arial Narrow, Helvetica Neue Condensed, Arial, sans-serif" font-size="38" font-weight="850" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">—</text><text x="348" y="458" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="600" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">Gate</text><line x1="549" y1="410" x2="559" y2="410" stroke="#F8C2BE" stroke-width="4" opacity="1"/><path d="M 559 402 L 573 410 L 559 418 Z" fill="#F8C2BE"/><rect x="578" y="300" width="220" height="220" fill="#FFFFFF" opacity="1" rx="28" stroke="#EAD8DF" stroke-width="1"/><text x="602" y="346" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="800" fill="#DB002E" text-anchor="start" letter-spacing="0.9" opacity="1">RELEVANS</text><text x="602" y="418" font-family="Arial Narrow, Helvetica Neue Condensed, Arial, sans-serif" font-size="38" font-weight="850" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">—</text><text x="602" y="458" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="600" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">analytisk profil</text><line x1="803" y1="410" x2="813" y2="410" stroke="#F8C2BE" stroke-width="4" opacity="1"/><path d="M 813 402 L 827 410 L 813 418 Z" fill="#F8C2BE"/><rect x="832" y="300" width="220" height="220" fill="#FFFFFF" opacity="1" rx="28" stroke="#EAD8DF" stroke-width="1"/><text x="856" y="346" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="800" fill="#DB002E" text-anchor="start" letter-spacing="0.9" opacity="1">DIALOGPALETT</text><text x="856" y="418" font-family="Arial Narrow, Helvetica Neue Condensed, Arial, sans-serif" font-size="38" font-weight="850" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">7</text><text x="856" y="458" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="600" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">för RFSU</text><line x1="1057" y1="410" x2="1067" y2="410" stroke="#F8C2BE" stroke-width="4" opacity="1"/><path d="M 1067 402 L 1081 410 L 1067 418 Z" fill="#F8C2BE"/><rect x="1086" y="300" width="220" height="220" fill="#FFFFFF" opacity="1" rx="28" stroke="#EAD8DF" stroke-width="1"/><text x="1110" y="346" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="800" fill="#DB002E" text-anchor="start" letter-spacing="0.9" opacity="1">DIALOG MED RFSU</text><text x="1110" y="418" font-family="Arial Narrow, Helvetica Neue Condensed, Arial, sans-serif" font-size="38" font-weight="850" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">↔</text><text x="1110" y="458" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="600" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">fältkunskap</text><line x1="1311" y1="410" x2="1321" y2="410" stroke="#F8C2BE" stroke-width="4" opacity="1"/><path d="M 1321 402 L 1335 410 L 1321 418 Z" fill="#F8C2BE"/><rect x="1340" y="300" width="220" height="220" fill="#FFFFFF" opacity="1" rx="28" stroke="#EAD8DF" stroke-width="1"/><text x="1364" y="346" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="800" fill="#DB002E" text-anchor="start" letter-spacing="0.9" opacity="1">TRE CASE</text><text x="1364" y="418" font-family="Arial Narrow, Helvetica Neue Condensed, Arial, sans-serif" font-size="38" font-weight="850" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">0/3</text><text x="1364" y="458" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="600" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">slutligt urval</text><text x="70" y="604" font-family="Arial, Helvetica Neue, sans-serif" font-size="14" font-weight="500" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">Kända tal visas. Grundkrav och relevans är bedömningssteg och får därför inga fabricerade deltal.</text><rect x="70" y="646" width="420" height="38" fill="#4A0C2C" opacity="1" rx="19.0"/><text x="280.0" y="671.84" font-family="Arial, Helvetica Neue, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4" opacity="1">ALLA → GATE → RELEVANS → PALETT → DIALOG → TRE</text></svg>