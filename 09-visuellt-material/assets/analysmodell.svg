<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">Analysmodell 1.0</title><desc id="svg-desc">Synopsis 1.0 visualiserad som normativ benchmark, realiseringssystem, gap och förbättring.</desc><rect width="1600" height="900" fill="#FFF8F7"/><rect x="0" y="0" width="1600" height="14" fill="#DB002E" opacity="1"/><text x="70" y="74" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="800" fill="#DB002E" text-anchor="start" letter-spacing="1.5" opacity="1">VIS-RFSU-003 · V1.0</text><text x="70" y="114" font-family="Arial Narrow, Helvetica Neue Condensed, Arial, sans-serif" font-size="32" font-weight="800" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">Från vårdram till realiserbar vårdmöjlighet</text><text x="70" y="142" font-family="Arial, Helvetica Neue, sans-serif" font-size="14" font-weight="400" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">Analysen omprövar inte den nationella ramen. Den undersöker hur väl den</text><text x="70" y="161" font-family="Arial, Helvetica Neue, sans-serif" font-size="14" font-weight="400" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">realiseras för de grupper RFSU särskilt värnar om.</text><rect x="70" y="250" width="450" height="170" fill="#4A0C2C" opacity="1" rx="28" stroke="#4A0C2C" stroke-width="1"/><rect x="90" y="268" width="52" height="28" fill="#FFFFFF" opacity="1" rx="14.0"/><text x="116.0" y="287.04" font-family="Arial, Helvetica Neue, sans-serif" font-size="11" font-weight="700" fill="#4A0C2C" text-anchor="middle" letter-spacing="0.4" opacity="1">01</text><text x="90" y="325" font-family="Arial Narrow, Helvetica Neue Condensed, Arial, sans-serif" font-size="17" font-weight="850" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">NATIONELL VÅRDRAM</text><text x="90" y="373" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">Fast benchmark: jämlik, personcentrerad,</text><text x="90" y="389" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">holistisk/sammanhållen och tillgänglig vård.</text><rect x="575" y="250" width="450" height="170" fill="#FFFFFF" opacity="1" rx="28" stroke="#DB002E" stroke-width="1"/><rect x="595" y="268" width="52" height="28" fill="#DB002E" opacity="1" rx="14.0"/><text x="621.0" y="287.04" font-family="Arial, Helvetica Neue, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4" opacity="1">02</text><text x="595" y="325" font-family="Arial Narrow, Helvetica Neue Condensed, Arial, sans-serif" font-size="17" font-weight="850" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">STRUKTURELLA VILLKOR</text><text x="595" y="373" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="500" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">Uppdrag, avtal, finansiering, geografi, access och</text><text x="595" y="389" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="500" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">organisering.</text><rect x="1080" y="250" width="450" height="170" fill="#FDEAE8" opacity="1" rx="28" stroke="#DB002E" stroke-width="1"/><rect x="1100" y="268" width="52" height="28" fill="#DB002E" opacity="1" rx="14.0"/><text x="1126.0" y="287.04" font-family="Arial, Helvetica Neue, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4" opacity="1">03</text><text x="1100" y="325" font-family="Arial Narrow, Helvetica Neue Condensed, Arial, sans-serif" font-size="17" font-weight="850" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">ORGANISATORISKT KAPITAL</text><text x="1100" y="373" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="500" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">Kompetens, samordning, kunskap, handlingsutrymme,</text><text x="1100" y="389" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="500" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">kontinuitet och kapacitet.</text><rect x="70" y="475" width="450" height="170" fill="#FFFFFF" opacity="1" rx="28" stroke="#DB002E" stroke-width="1"/><rect x="90" y="493" width="52" height="28" fill="#DB002E" opacity="1" rx="14.0"/><text x="116.0" y="512.04" font-family="Arial, Helvetica Neue, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4" opacity="1">04</text><text x="90" y="550" font-family="Arial Narrow, Helvetica Neue Condensed, Arial, sans-serif" font-size="17" font-weight="850" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">FAKTISK PRAKTIK</text><text x="90" y="598" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="500" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">Vad händer faktiskt? Vem gör vad? Hur identifieras och</text><text x="90" y="614" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="500" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">möts behov?</text><rect x="575" y="475" width="450" height="170" fill="#FDEAE8" opacity="1" rx="28" stroke="#DB002E" stroke-width="1"/><rect x="595" y="493" width="52" height="28" fill="#DB002E" opacity="1" rx="14.0"/><text x="621.0" y="512.04" font-family="Arial, Helvetica Neue, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4" opacity="1">05</text><text x="595" y="550" font-family="Arial Narrow, Helvetica Neue Condensed, Arial, sans-serif" font-size="17" font-weight="850" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">KVANTITET + KVALITET</text><text x="595" y="598" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="500" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">Hur mycket vårdmöjlighet finns — och vilken vård kan</text><text x="595" y="614" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="500" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">personen faktiskt få?</text><rect x="1080" y="475" width="450" height="170" fill="#4A0C2C" opacity="1" rx="28" stroke="#4A0C2C" stroke-width="1"/><rect x="1100" y="493" width="52" height="28" fill="#FFFFFF" opacity="1" rx="14.0"/><text x="1126.0" y="512.04" font-family="Arial, Helvetica Neue, sans-serif" font-size="11" font-weight="700" fill="#4A0C2C" text-anchor="middle" letter-spacing="0.4" opacity="1">06</text><text x="1100" y="550" font-family="Arial Narrow, Helvetica Neue Condensed, Arial, sans-serif" font-size="17" font-weight="850" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">REALISERBAR VÅRDMÖJLIGHET</text><text x="1100" y="598" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">Vad kan personen faktiskt nå och få, inte bara vad som</text><text x="1100" y="614" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">formellt erbjuds?</text><rect x="70" y="700" width="450" height="170" fill="#FFFFFF" opacity="1" rx="28" stroke="#DB002E" stroke-width="1"/><rect x="90" y="718" width="52" height="28" fill="#DB002E" opacity="1" rx="14.0"/><text x="116.0" y="737.04" font-family="Arial, Helvetica Neue, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4" opacity="1">07</text><text x="90" y="775" font-family="Arial Narrow, Helvetica Neue Condensed, Arial, sans-serif" font-size="17" font-weight="850" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">JÄMLIKHETSGAP</text><text x="90" y="823" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="500" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">Var uppstår systematiska gap mellan vårdramen och den</text><text x="90" y="839" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="500" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">faktiska möjligheten?</text><rect x="575" y="700" width="450" height="170" fill="#FDEAE8" opacity="1" rx="28" stroke="#DB002E" stroke-width="1"/><rect x="595" y="718" width="52" height="28" fill="#DB002E" opacity="1" rx="14.0"/><text x="621.0" y="737.04" font-family="Arial, Helvetica Neue, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4" opacity="1">08</text><text x="595" y="775" font-family="Arial Narrow, Helvetica Neue Condensed, Arial, sans-serif" font-size="17" font-weight="850" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">HINDER + MÖJLIGGÖRARE</text><text x="595" y="823" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="500" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">Vilka strukturer, mekanismer och praktiker skapar</text><text x="595" y="839" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="500" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">eller minskar gapet?</text><rect x="1080" y="700" width="450" height="170" fill="#4A0C2C" opacity="1" rx="28" stroke="#4A0C2C" stroke-width="1"/><rect x="1100" y="718" width="52" height="28" fill="#FFFFFF" opacity="1" rx="14.0"/><text x="1126.0" y="737.04" font-family="Arial, Helvetica Neue, sans-serif" font-size="11" font-weight="700" fill="#4A0C2C" text-anchor="middle" letter-spacing="0.4" opacity="1">09</text><text x="1100" y="775" font-family="Arial Narrow, Helvetica Neue Condensed, Arial, sans-serif" font-size="17" font-weight="850" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">FÖRBÄTTRING + ÖVERFÖRBARHET</text><text x="1100" y="823" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">Vad bör förändras, för vem, under vilka villkor — och</text><text x="1100" y="839" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">vad kan flyttas?</text><line x1="526" y1="335.0" x2="551" y2="335.0" stroke="#F8C2BE" stroke-width="3" opacity="1"/><path d="M 551 327.0 L 565 335.0 L 551 343.0 Z" fill="#F8C2BE"/><line x1="1031" y1="335.0" x2="1056" y2="335.0" stroke="#F8C2BE" stroke-width="3" opacity="1"/><path d="M 1056 327.0 L 1070 335.0 L 1056 343.0 Z" fill="#F8C2BE"/><line x1="1305.0" y1="426" x2="281.0" y2="465" stroke="#F8C2BE" stroke-width="3" opacity="1"/><path d="M 281.0 457 L 295.0 465 L 281.0 473 Z" fill="#F8C2BE"/><line x1="526" y1="560.0" x2="551" y2="560.0" stroke="#F8C2BE" stroke-width="3" opacity="1"/><path d="M 551 552.0 L 565 560.0 L 551 568.0 Z" fill="#F8C2BE"/><line x1="1031" y1="560.0" x2="1056" y2="560.0" stroke="#F8C2BE" stroke-width="3" opacity="1"/><path d="M 1056 552.0 L 1070 560.0 L 1056 568.0 Z" fill="#F8C2BE"/><line x1="1305.0" y1="651" x2="281.0" y2="690" stroke="#F8C2BE" stroke-width="3" opacity="1"/><path d="M 281.0 682 L 295.0 690 L 281.0 698 Z" fill="#F8C2BE"/><line x1="526" y1="785.0" x2="551" y2="785.0" stroke="#F8C2BE" stroke-width="3" opacity="1"/><path d="M 551 777.0 L 565 785.0 L 551 793.0 Z" fill="#F8C2BE"/><line x1="1031" y1="785.0" x2="1056" y2="785.0" stroke="#F8C2BE" stroke-width="3" opacity="1"/><path d="M 1056 777.0 L 1070 785.0 L 1056 793.0 Z" fill="#F8C2BE"/><text x="70" y="835" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="600" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">Synopsis 1.0 är aktiv tolkningsram. Tidigare analysversioner bevaras i backlog/historik som genealogi.</text></svg>