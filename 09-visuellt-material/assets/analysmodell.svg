<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">Analysmodell</title><desc id="svg-desc">Visualisering av hur strukturella villkor kopplas till praktik, mekanism och överförbarhet.</desc><rect width="1600" height="760" fill="#FFF8F7"/><rect x="0" y="0" width="1600" height="14" fill="#DB002E" opacity="1"/><text x="70" y="74" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="800" fill="#DB002E" text-anchor="start" letter-spacing="1.5" opacity="1">VIS-RFSU-003</text><text x="70" y="114" font-family="Arial Narrow, Helvetica Neue Condensed, Arial, sans-serif" font-size="32" font-weight="800" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">Från villkor till överförbar kunskap</text><text x="70" y="142" font-family="Arial, Helvetica Neue, sans-serif" font-size="14" font-weight="400" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">Analysen söker inte bara vad som fungerar, utan hur, under vilka villkor och</text><text x="70" y="161" font-family="Arial, Helvetica Neue, sans-serif" font-size="14" font-weight="400" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">var gränserna går.</text><rect x="70" y="260" width="225" height="330" fill="#FFFFFF" opacity="1" rx="28" stroke="#EAD8DF" stroke-width="1"/><rect x="92" y="282" width="54" height="30" fill="#DB002E" opacity="1" rx="15.0"/><text x="119.0" y="302.4" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4" opacity="1">01</text><text x="92" y="348" font-family="Arial Narrow, Helvetica Neue Condensed, Arial, sans-serif" font-size="17" font-weight="850" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">STRUKTUR</text><text x="92" y="420" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="500" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">Vilka regionala,</text><text x="92" y="438" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="500" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">organisatoriska och</text><text x="92" y="456" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="500" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">avtalsmässiga villkor</text><text x="92" y="474" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="500" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">formar arbetet?</text><line x1="299" y1="425" x2="304" y2="425" stroke="#F8C2BE" stroke-width="3" opacity="1"/><path d="M 304 417 L 318 425 L 304 433 Z" fill="#F8C2BE"/><rect x="322" y="260" width="225" height="330" fill="#FFFFFF" opacity="1" rx="28" stroke="#EAD8DF" stroke-width="1"/><rect x="344" y="282" width="54" height="30" fill="#DB002E" opacity="1" rx="15.0"/><text x="371.0" y="302.4" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4" opacity="1">02</text><text x="344" y="348" font-family="Arial Narrow, Helvetica Neue Condensed, Arial, sans-serif" font-size="17" font-weight="850" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">PRAKTIK</text><text x="344" y="420" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="500" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">Vad gör mottagningen</text><text x="344" y="438" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="500" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">faktiskt i mötet med</text><text x="344" y="456" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="500" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">behov och målgrupper?</text><line x1="551" y1="425" x2="556" y2="425" stroke="#F8C2BE" stroke-width="3" opacity="1"/><path d="M 556 417 L 570 425 L 556 433 Z" fill="#F8C2BE"/><rect x="574" y="260" width="225" height="330" fill="#FFFFFF" opacity="1" rx="28" stroke="#EAD8DF" stroke-width="1"/><rect x="596" y="282" width="54" height="30" fill="#DB002E" opacity="1" rx="15.0"/><text x="623.0" y="302.4" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4" opacity="1">03</text><text x="596" y="348" font-family="Arial Narrow, Helvetica Neue Condensed, Arial, sans-serif" font-size="17" font-weight="850" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">MEKANISM</text><text x="596" y="420" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="500" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">Vad i arbetssättet tycks</text><text x="596" y="438" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="500" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">bära den verksamma</text><text x="596" y="456" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="500" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">funktionen?</text><line x1="803" y1="425" x2="808" y2="425" stroke="#F8C2BE" stroke-width="3" opacity="1"/><path d="M 808 417 L 822 425 L 808 433 Z" fill="#F8C2BE"/><rect x="826" y="260" width="225" height="330" fill="#FFFFFF" opacity="1" rx="28" stroke="#EAD8DF" stroke-width="1"/><rect x="848" y="282" width="54" height="30" fill="#DB002E" opacity="1" rx="15.0"/><text x="875.0" y="302.4" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4" opacity="1">04</text><text x="848" y="348" font-family="Arial Narrow, Helvetica Neue Condensed, Arial, sans-serif" font-size="17" font-weight="850" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">HINDER /</text><text x="848" y="369" font-family="Arial Narrow, Helvetica Neue Condensed, Arial, sans-serif" font-size="17" font-weight="850" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">MÖJLIGGÖRARE</text><text x="848" y="420" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="500" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">Vad förstärker eller</text><text x="848" y="438" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="500" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">begränsar praktiken?</text><line x1="1055" y1="425" x2="1060" y2="425" stroke="#F8C2BE" stroke-width="3" opacity="1"/><path d="M 1060 417 L 1074 425 L 1060 433 Z" fill="#F8C2BE"/><rect x="1078" y="260" width="225" height="330" fill="#FFFFFF" opacity="1" rx="28" stroke="#EAD8DF" stroke-width="1"/><rect x="1100" y="282" width="54" height="30" fill="#DB002E" opacity="1" rx="15.0"/><text x="1127.0" y="302.4" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4" opacity="1">05</text><text x="1100" y="348" font-family="Arial Narrow, Helvetica Neue Condensed, Arial, sans-serif" font-size="17" font-weight="850" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">ÖVERFÖRBARHET</text><text x="1100" y="420" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="500" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">Vad kan flyttas — och</text><text x="1100" y="438" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="500" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">vilka villkor måste följa</text><text x="1100" y="456" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="500" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">med?</text><line x1="1307" y1="425" x2="1312" y2="425" stroke="#F8C2BE" stroke-width="3" opacity="1"/><path d="M 1312 417 L 1326 425 L 1312 433 Z" fill="#F8C2BE"/><rect x="1330" y="260" width="225" height="330" fill="#FFFFFF" opacity="1" rx="28" stroke="#EAD8DF" stroke-width="1"/><rect x="1352" y="282" width="54" height="30" fill="#DB002E" opacity="1" rx="15.0"/><text x="1379.0" y="302.4" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4" opacity="1">06</text><text x="1352" y="348" font-family="Arial Narrow, Helvetica Neue Condensed, Arial, sans-serif" font-size="17" font-weight="850" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">REKOMMENDATION</text><text x="1352" y="420" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="500" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">Vad blir användbart för</text><text x="1352" y="438" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="500" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">andra sammanhang och för</text><text x="1352" y="456" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="500" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">RFSU?</text></svg>