<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">Uppdraget i korthet</title><desc id="svg-desc">Översikt över uppdragets syfte, urval, metod, ramar och leverans.</desc><rect width="1600" height="850" fill="#FFF8F7"/><rect x="0" y="0" width="1600" height="14" fill="#DB002E" opacity="1"/><text x="70" y="74" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="800" fill="#DB002E" text-anchor="start" letter-spacing="1.5" opacity="1">VIS-RFSU-001</text><text x="70" y="114" font-family="Arial Narrow, Helvetica Neue Condensed, Arial, sans-serif" font-size="32" font-weight="800" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">Uppdraget i korthet</text><text x="70" y="142" font-family="Arial, Helvetica Neue, sans-serif" font-size="14" font-weight="400" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">Goda exempel på jämlik SRHR-vård för personer över ungdomsmottagningsålder</text><rect x="70" y="260" width="690" height="200" fill="#FFFFFF" opacity="1" rx="28" stroke="#EAD8DF" stroke-width="1"/><text x="100" y="305" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="800" fill="#DB002E" text-anchor="start" letter-spacing="1.2" opacity="1">FRÅGAN</text><text x="100" y="354" font-family="Arial, Helvetica Neue, sans-serif" font-size="18" font-weight="650" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">Vad kan vi lära av mottagningar som försöker hålla ihop</text><text x="100" y="379" font-family="Arial, Helvetica Neue, sans-serif" font-size="18" font-weight="650" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">vuxnas sexuella och reproduktiva hälsa?</text><rect x="810" y="260" width="690" height="200" fill="#FFFFFF" opacity="1" rx="28" stroke="#EAD8DF" stroke-width="1"/><text x="840" y="305" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="800" fill="#DB002E" text-anchor="start" letter-spacing="1.2" opacity="1">URVALET</text><text x="840" y="354" font-family="Arial, Helvetica Neue, sans-serif" font-size="18" font-weight="650" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">3 mottagningar väljs tillsammans med RFSU ur ett bredare</text><text x="840" y="379" font-family="Arial, Helvetica Neue, sans-serif" font-size="18" font-weight="650" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">källkontrollerat fält.</text><rect x="70" y="505" width="690" height="200" fill="#FFFFFF" opacity="1" rx="28" stroke="#EAD8DF" stroke-width="1"/><text x="100" y="550" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="800" fill="#DB002E" text-anchor="start" letter-spacing="1.2" opacity="1">UNDERLAGET</text><text x="100" y="599" font-family="Arial, Helvetica Neue, sans-serif" font-size="18" font-weight="650" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">Strukturella villkor kombineras med intervjuer och/eller</text><text x="100" y="624" font-family="Arial, Helvetica Neue, sans-serif" font-size="18" font-weight="650" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">fokusgrupper om faktisk praktik.</text><rect x="810" y="505" width="690" height="200" fill="#FFFFFF" opacity="1" rx="28" stroke="#EAD8DF" stroke-width="1"/><text x="840" y="550" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="800" fill="#DB002E" text-anchor="start" letter-spacing="1.2" opacity="1">LEVERANSEN</text><text x="840" y="599" font-family="Arial, Helvetica Neue, sans-serif" font-size="18" font-weight="650" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">Jämförande analys, förbättringsförslag och rapport på</text><text x="840" y="624" font-family="Arial, Helvetica Neue, sans-serif" font-size="18" font-weight="650" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">högst 30 sidor.</text><text x="70" y="780" font-family="Arial, Helvetica Neue, sans-serif" font-size="14" font-weight="600" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">Rapport senast 29 jan 2027 · Uppdrag helt klart senast 19 feb 2027</text></svg>