Arial, sans-serif" font-size="16" font-weight="820" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">navigation</text><line x1="930" y1="340" x2="936" y2="340" stroke="#F8C2BE" stroke-width="3" opacity="1"/><path d="M 936 332 L 950 340 L 936 348 Z" fill="#F8C2BE"/><rect x="955" y="250" width="185" height="180" fill="#FFFFFF" opacity="1" rx="28" stroke="#DB002E" stroke-width="1"/><rect x="973" y="268" width="42" height="28" fill="#DB002E" opacity="1" rx="14.0"/><text x="994.0" y="287.04" font-family="Arial, Helvetica Neue, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4" opacity="1">5</text><text x="973" y="328" font-family="Arial Narrow, Helvetica Neue Condensed, Arial, sans-serif" font-size="16" font-weight="820" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">Relevant vård</text><line x1="1145" y1="340" x2="1151" y2="340" stroke="#F8C2BE" stroke-width="3" opacity="1"/><path d="M 1151 332 L 1165 340 L 1151 348 Z" fill="#F8C2BE"/><rect x="1170" y="250" width="185" height="180" fill="#FDEAE8" opacity="1" rx="28" stroke="#DB002E" stroke-width="1"/><rect x="1188" y="268" width="42" height="28" fill="#DB002E" opacity="1" rx="14.0"/><text x="1209.0" y="287.04" font-family="Arial, Helvetica Neue, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4" opacity="1">6</text><text x="1188" y="328" font-family="Arial Narrow, Helvetica Neue Condensed, Arial, sans-serif" font-size="16" font-weight="820" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">Genomförd vård</text><line x1="1360" y1="340" x2="1366" y2="340" stroke="#F8C2BE" stroke-width="3" opacity="1"/><path d="M 1366 332 L 1380 340 L 1366 348 Z" fill="#F8C2BE"/><rect x="1385" y="250" width="185" height="180" fill="#FFFFFF" opacity="1" rx="28" stroke="#DB002E" stroke-width="1"/><rect x="1403" y="268" width="42" height="28" fill="#DB002E" opacity="1" rx="14.0"/><text x="1424.0" y="287.04" font-family="Arial, Helvetica Neue, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4" opacity="1">7</text><text x="1403" y="328" font-family="Arial Narrow, Helvetica Neue Condensed, Arial, sans-serif" font-size="16" font-weight="820" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">Helhetsupplevelse</text><rect x="95" y="480" width="685" height="155" fill="#FDEAE8" opacity="1" rx="28" stroke="#DB002E" stroke-width="1"/><text x="120" y="520" font-family="Arial, Helvetica Neue, sans-serif" font-size="14" font-weight="850" fill="#DB002E" text-anchor="start" letter-spacing="0" opacity="1">TEORETISK VÅRDRESA</text><text x="120" y="558" font-family="Arial, Helvetica Neue, sans-serif" font-size="18" font-weight="650" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">Den väg systemets formella organisering innebär att</text><text x="120" y="582" font-family="Arial, Helvetica Neue, sans-serif" font-size="18" font-weight="650" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">personen ska kunna ta.</text><rect x="820" y="480" width="685" height="155" fill="#FFFFFF" opacity="1" rx="28" stroke="#DB002E" stroke-width="1"/><text x="845" y="520" font-family="Arial, Helvetica Neue, sans-serif" font-size="14" font-weight="850" fill="#DB002E" text-anchor="start" letter-spacing="0" opacity="1">PRAKTISK VÅRDRESA</text><text x="845" y="558" font-family="Arial, Helvetica Neue, sans-serif" font-size="18" font-weight="650" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">Den väg personen faktiskt behöver och kan ta —</text><text x="845" y="582" font-family="Arial, Helvetica Neue, sans-serif" font-size="18" font-weight="650" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">inklusive extra steg, hänvisningar och egen</text><text x="845" y="606" font-family="Arial, Helvetica Neue, sans-serif" font-size="18" font-weight="650" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">koordinering.</text><line x1="780" y1="557" x2="801" y2="557" stroke="#DB002E" stroke-width="4" opacity="1"/><path d="M 801 549 L 815 557 L 801 565 Z" fill="#DB002E"/><text x="800" y="685" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="850" fill="#DB002E" text-anchor="middle" letter-spacing="0" opacity="1">ANALYSERA GAPET</text><rect x="95" y="725" width="1410" height="125" fill="#4A0C2C" opacity="1" rx="28" stroke="#4A0C2C" stroke-width="1"/><text x="120" y="762" font-family="Arial, Helvetica Neue, sans-serif" font-size="14" font-weight="850" fill="#F8C2BE" text-anchor="start" letter-spacing="0" opacity="1">HÄLSOLITERACITET / NAVIGATION</text><text x="120" y="808" font-family="Arial, Helvetica Neue, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">Vilka krav ställer systemet på att personen ska hitta, förstå, värdera, använda och navigera — och vilket stöd ger systemet?</text><text x="95" y="885" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="600" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">Analyslins — inte individuell scoring och inte en separat patientstudie i grunddesignen.</text></svg>