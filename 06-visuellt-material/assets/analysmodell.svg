<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">Analysmodell 1.1</title><desc id="svg-desc">Synopsis 1.1: nationell vårdram, realiseringssystem, individens vårdrealiseringsresa, gap och förbättring.</desc><rect width="1600" height="1040" fill="#FFF8F7"/><rect x="0" y="0" width="1600" height="14" fill="#DB002E" opacity="1"/><text x="70" y="74" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="800" fill="#DB002E" text-anchor="start" letter-spacing="1.5" opacity="1">VIS-RFSU-003 · V1.1</text><text x="70" y="114" font-family="Arial Narrow, Helvetica Neue Condensed, Arial, sans-serif" font-size="32" font-weight="800" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">Tre nivåer — en analyskedja</text><text x="70" y="142" font-family="Arial, Helvetica Neue, sans-serif" font-size="14" font-weight="400" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">Mottagningen är case. Individens vårdrealiseringsresa är banan som följs genom</text><text x="70" y="161" font-family="Arial, Helvetica Neue, sans-serif" font-size="14" font-weight="400" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">systemet.</text><rect x="70" y="220" width="1460" height="150" fill="#4A0C2C" opacity="1" rx="28" stroke="#4A0C2C" stroke-width="1"/><text x="100" y="260" font-family="Arial, Helvetica Neue, sans-serif" font-size="14" font-weight="800" fill="#F8C2BE" text-anchor="start" letter-spacing="1.2" opacity="1">NIVÅ 1 · NATIONELL VÅRDRAM</text><text x="100" y="306" font-family="Arial Narrow, Helvetica Neue Condensed, Arial, sans-serif" font-size="28" font-weight="850" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">Jämlik · personcentrerad · sammanhållen · tillgänglig</text><text x="100" y="340" font-family="Arial, Helvetica Neue, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">Fast benchmark — inte ett utforskande analysobjekt.</text><rect x="70" y="410" width="450" height="150" fill="#FDEAE8" opacity="1" rx="28" stroke="#DB002E" stroke-width="1"/><text x="94" y="454" font-family="Arial, Helvetica Neue, sans-serif" font-size="15" font-weight="850" fill="#4A0C2C" text-anchor="start" letter-spacing="0" opacity="1">STRUKTURELLA VILLKOR</text><text x="94" y="498" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="550" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">uppdrag · avtal · geografi · access ·</text><text x="94" y="516" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="550" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">organisering</text><line x1="528" y1="485" x2="553" y2="485" stroke="#F8C2BE" stroke-width="3" opacity="1"/><path d="M 553 477 L 567 485 L 553 493 Z" fill="#F8C2BE"/><rect x="575" y="410" width="450" height="150" fill="#FFFFFF" opacity="1" rx="28" stroke="#DB002E" stroke-width="1"/><text x="599" y="454" font-family="Arial, Helvetica Neue, sans-serif" font-size="15" font-weight="850" fill="#4A0C2C" text-anchor="start" letter-spacing="0" opacity="1">ORGANISATORISKT KAPITAL</text><text x="599" y="498" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="550" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">kompetens · samordning · kunskap · kapacitet</text><line x1="1033" y1="485" x2="1058" y2="485" stroke="#F8C2BE" stroke-width="3" opacity="1"/><path d="M 1058 477 L 1072 485 L 1058 493 Z" fill="#F8C2BE"/><rect x="1080" y="410" width="450" height="150" fill="#FDEAE8" opacity="1" rx="28" stroke="#DB002E" stroke-width="1"/><text x="1104" y="454" font-family="Arial, Helvetica Neue, sans-serif" font-size="15" font-weight="850" fill="#4A0C2C" text-anchor="start" letter-spacing="0" opacity="1">FAKTISK PRAKTIK</text><text x="1104" y="498" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="550" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">vad händer faktiskt? hur identifieras och möts</text><text x="1104" y="516" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="550" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">behov?</text><rect x="70" y="615" width="1460" height="245" fill="#FFFFFF" opacity="1" rx="28" stroke="#DB002E" stroke-width="1"/><text x="100" y="657" font-family="Arial, Helvetica Neue, sans-serif" font-size="14" font-weight="850" fill="#DB002E" text-anchor="start" letter-spacing="1.1" opacity="1">NIVÅ 3 · INDIVIDENS VÅRDREALISERINGSRESA</text><line x1="145.0" y1="743" x2="302.66666666666663" y2="743" stroke="#F8C2BE" stroke-width="4" opacity="1"/><path d="M 302.66666666666663 735 L 316.66666666666663 743 L 302.66666666666663 751 Z" fill="#F8C2BE"/><circle cx="120.0" cy="743" r="28" fill="#FDEAE8" stroke="#DB002E" stroke-width="3"/><text x="120.0" y="748" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="850" fill="#4A0C2C" text-anchor="middle" letter-spacing="0" opacity="1">1</text><text x="120.0" y="801" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="700" fill="#24141D" text-anchor="middle" letter-spacing="0" opacity="1">Behov</text><line x1="366.66666666666663" y1="743" x2="524.3333333333333" y2="743" stroke="#F8C2BE" stroke-width="4" opacity="1"/><path d="M 524.3333333333333 735 L 538.3333333333333 743 L 524.3333333333333 751 Z" fill="#F8C2BE"/><circle cx="341.66666666666663" cy="743" r="28" fill="#FDEAE8" stroke="#DB002E" stroke-width="3"/><text x="341.66666666666663" y="748" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="850" fill="#4A0C2C" text-anchor="middle" letter-spacing="0" opacity="1">2</text><text x="341.66666666666663" y="801" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="700" fill="#24141D" text-anchor="middle" letter-spacing="0" opacity="1">Orientering</text><line x1="588.3333333333333" y1="743" x2="745.9999999999999" y2="743" stroke="#F8C2BE" stroke-width="4" opacity="1"/><path d="M 745.9999999999999 735 L 759.9999999999999 743 L 745.9999999999999 751 Z" fill="#F8C2BE"/><circle cx="563.3333333333333" cy="743" r="28" fill="#FDEAE8" stroke="#DB002E" stroke-width="3"/><text x="563.3333333333333" y="748" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="850" fill="#4A0C2C" text-anchor="middle" letter-spacing="0" opacity="1">3</text><text x="563.3333333333333" y="801" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="700" fill="#24141D" text-anchor="middle" letter-spacing="0" opacity="1">Vårdval / ingång</text><line x1="810.0" y1="743" x2="967.6666666666666" y2="743" stroke="#F8C2BE" stroke-width="4" opacity="1"/><path d="M 967.6666666666666 735 L 981.6666666666666 743 L 967.6666666666666 751 Z" fill="#F8C2BE"/><circle cx="785.0" cy="743" r="28" fill="#FDEAE8" stroke="#DB002E" stroke-width="3"/><text x="785.0" y="748" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="850" fill="#4A0C2C" text-anchor="middle" letter-spacing="0" opacity="1">4</text><text x="785.0" y="801" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="700" fill="#24141D" text-anchor="middle" letter-spacing="0" opacity="1">Vårdkedja /</text><text x="785.0" y="817" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="700" fill="#24141D" text-anchor="middle" letter-spacing="0" opacity="1">navigation</text><line x1="1031.6666666666665" y1="743" x2="1189.3333333333333" y2="743" stroke="#F8C2BE" stroke-width="4" opacity="1"/><path d="M 1189.3333333333333 735 L 1203.3333333333333 743 L 1189.3333333333333 751 Z" fill="#F8C2BE"/><circle cx="1006.6666666666666" cy="743" r="28" fill="#FDEAE8" stroke="#DB002E" stroke-width="3"/><text x="1006.6666666666666" y="748" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="850" fill="#4A0C2C" text-anchor="middle" letter-spacing="0" opacity="1">5</text><text x="1006.6666666666666" y="801" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="700" fill="#24141D" text-anchor="middle" letter-spacing="0" opacity="1">Relevant vård</text><line x1="1253.3333333333333" y1="743" x2="1411.0" y2="743" stroke="#F8C2BE" stroke-width="4" opacity="1"/><path d="M 1411.0 735 L 1425.0 743 L 1411.0 751 Z" fill="#F8C2BE"/><circle cx="1228.3333333333333" cy="743" r="28" fill="#FDEAE8" stroke="#DB002E" stroke-width="3"/><text x="1228.3333333333333" y="748" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="850" fill="#4A0C2C" text-anchor="middle" letter-spacing="0" opacity="1">6</text><text x="1228.3333333333333" y="801" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="700" fill="#24141D" text-anchor="middle" letter-spacing="0" opacity="1">Genomförd vård</text><circle cx="1450.0" cy="743" r="28" fill="#FDEAE8" stroke="#DB002E" stroke-width="3"/><text x="1450.0" y="748" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="850" fill="#4A0C2C" text-anchor="middle" letter-spacing="0" opacity="1">7</text><text x="1450.0" y="801" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="700" fill="#24141D" text-anchor="middle" letter-spacing="0" opacity="1">Helhetsupplevelse</text><text x="100" y="833" font-family="Arial, Helvetica Neue, sans-serif" font-size="14" font-weight="700" fill="#4A0C2C" text-anchor="start" letter-spacing="0" opacity="1">Hälsoliteracitet som gränssnitt: hitta/accessa → förstå → värdera → använda → navigera</text><text x="70" y="905" font-family="Arial, Helvetica Neue, sans-serif" font-size="12" font-weight="850" fill="#DB002E" text-anchor="start" letter-spacing="1.2" opacity="1">ANALYTISK UTGÅNG</text><text x="70" y="947" font-family="Arial, Helvetica Neue, sans-serif" font-size="18" font-weight="750" fill="#24141D" text-anchor="start" letter-spacing="0" opacity="1">Kvantitet + kvalitet → realiserbar vårdmöjlighet → jämlikhetsgap → hinder/möjliggörare → förbättring + överförbarhet</text><text x="70" y="1005" font-family="Arial, Helvetica Neue, sans-serif" font-size="13" font-weight="600" fill="#745C69" text-anchor="start" letter-spacing="0" opacity="1">Synopsis 1.1: analytisk bredd ska i första hand absorberas i analysen — inte skapa mer fältarbete.</text></svg>